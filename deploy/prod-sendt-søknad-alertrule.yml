apiVersion: "monitoring.coreos.com/v1"
kind: PrometheusRule
metadata:
  labels:
    team: tbd
  name: sendt-soknad-alert
  namespace: tbd
spec:
  groups:
    - name: sendt-soknad-alert
      rules:
        - alert: Det er mottatt mistenkelig få søknader de siste 15 minuttene
          # Prometheus evaluerer hour() i UTC. Oslo er UTC+1 om vinteren og UTC+2 om sommeren (sommertid),
          # men vinduet 07-16 lokal vintertid og 08-17 lokal sommertid tilsvarer begge UTC 06-15,
          # så hour() >= 6 and hour() < 15 dekker riktig lokalt tidsrom hele året uten DST-håndtering.
          expr: |
            sum(rate(message_counter_total{app="spedisjon", river=~"Sendte.*", validated="ok"}[15m])) < 0.01
            and hour() >= 6 and hour() < 15
            and day_of_week() >= 1 and day_of_week() <= 5
          # rate(...[15m]) fanger allerede opp at raten har vært under terskelen i 15 minutter,
          # så "for" settes til 0m for å unngå at vi legger enda en forsinkelse på toppen.
          for: 0m
          annotations:
            beskrivelse: "Det er ikke registrert noen/veldig få sendte søknader i Spedisjon. Hør med Flex om det er noe krøll"
            detaljer: "Sjekk om du ser noe rart på <https://grafana.nav.cloud.nais.io/d/H8jR8MFGk/flex-kafka-lag?orgId=1&refresh=5m&viewPanel=28|grafana> eller <https://logs.adeo.no/app/r/s/NGiJM|kibana> da vel"
          labels:
            severity: "error"
            team_sas_alerts: slack
            alert_type: custom
