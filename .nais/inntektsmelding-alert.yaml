apiVersion: "monitoring.coreos.com/v1"
kind: PrometheusRule
metadata:
  labels:
    team: tbd
  name: inntektsmelding-alert
  namespace: tbd
spec:
  groups:
    - name: inntektmelding-alert
      rules:
        - alert: Det er mottatt mistenkelig få inntektsmeldinger de siste 15 minuttene
          # Prometheus evaluerer hour() i UTC. Oslo er UTC+1 om vinteren og UTC+2 om sommeren (sommertid),
          # men vinduet 08-15 lokal vintertid og 09-16 lokal sommertid tilsvarer begge UTC 07-14,
          # så hour() >= 7 and hour() < 14 dekker riktig lokalt tidsrom hele året uten DST-håndtering.
          # Starter en time senere enn sendt-soknad-alert fordi inntektsmeldinger har for lavt volum
          # i timen 06-07 UTC (5-persentil ~0.006/s mot terskel 0.01/s) og ga falske positiver.
          expr: |
            sum(rate(message_counter_total{app="spedisjon-async", validated="ok", river="ArbeidsgiveropplysningerRiver"}[15m])) < 0.01
            and hour() >= 7 and hour() < 14
            and day_of_week() >= 1 and day_of_week() <= 5
          # rate(...[15m]) fanger allerede opp at raten har vært under terskelen i 15 minutter,
          # så "for" settes til 0m for å unngå at vi legger enda en forsinkelse på toppen.
          for: 0m
          annotations:
            beskrivelse: "Det er ikke registert noen/veldig få inntektsmeldinger i Spedisjon. Hør med HAG om det er noe krøll."
            detaljer: "Sjekk om du ser noe rart på <https://grafana.nav.cloud.nais.io/d/oOJjNpkMz/poh-arbeidsgiver-kafka-prod?orgId=1|grafana> eller <https://logs.adeo.no/app/r/s/NGiJM|kibana> da vel"
          labels:
            severity: "error"
            team_sas_alerts: slack
            alert_type: custom
