apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spedisjon-async
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  strategy:
    type: Recreate
  liveness:
    path: isalive
  readiness:
    path: isready
    initialDelay: 5
  resources:
    requests:
      memory: 64Mi
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: spedisjon
        - application: speed-api
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spedisjon-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_EXTRA_TOPIC
      value: flex.sykepengesoknad,helsearbeidsgiver.privat-sykepenger-inntektsmelding
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
