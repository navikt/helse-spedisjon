apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spedisjon
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  strategy:
    type: RollingUpdate
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 5
    periodSeconds: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  replicas:
    min: 2
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: spedisjon-async
        - application: sporbar
        - application: sparkel-arbeidsgiver
        - application: spaghet
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
